server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache agressivo para assets versionados pelo Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — qualquer rota desconhecida devolve index.html.
  location / {
    try_files $uri /index.html;
  }
}
